services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a managed PostgreSQL connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique secret}
      LUMINEX_SEED_ON_START: ${LUMINEX_SEED_ON_START:-false}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-5000}/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
