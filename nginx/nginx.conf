events {}

http {
  upstream luminex_frontend { server frontend:3000; }
  upstream luminex_backend { server backend:5000; }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://luminex_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://luminex_frontend;
      proxy_set_header Host $host;
    }
  }
}
