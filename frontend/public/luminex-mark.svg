<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- BOH Vertical Pillar Gradient -->
    <linearGradient id="mark-boh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- FOH Horizontal Crescent / Cloche Gradient -->
    <linearGradient id="mark-foh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Center Spark Glow -->
    <radialGradient id="mark-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#99f6e4"/>
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient pulse glow behind the nexus -->
  <circle cx="21" cy="29" r="10" fill="url(#mark-spark)" opacity="0.6"/>

  <!-- Back-of-House (BOH) Vertical Pillar -->
  <path d="M14 9 C14 7.6 15.1 6.5 16.5 6.5 L21.5 6.5 C22.9 6.5 24 7.6 24 9 L24 28 C24 29.7 22.7 31 21 31 L16.5 31 C15.1 31 14 29.9 14 28.5 Z" fill="url(#mark-boh)" />

  <!-- Front-of-House (FOH) Horizontal Cloche Arch -->
  <path d="M16 30 C16 26.5 19 23.5 22.5 23.5 L35.5 23.5 C38.5 23.5 41 26 41 29 C41 34.5 36.5 39 31 39 L19 39 C17.3 39 16 37.7 16 36 Z" fill="url(#mark-foh)" />

  <!-- Bridge Nexus Connection -->
  <path d="M14 26 L24 26 L24 37 C24 38.1 23.1 39 22 39 L16.5 39 C15.1 39 14 37.9 14 36.5 Z" fill="#0f766e" opacity="0.95"/>

  <!-- The Lumen Spark (Point of Clarity & Sync) -->
  <g filter="url(#mark-glow)">
    <path d="M21 21 Q21 29 29 29 Q21 29 21 37 Q21 29 13 29 Q21 29 21 21 Z" fill="#ffffff" />
    <circle cx="21" cy="29" r="1.5" fill="#fef08a" />
  </g>

  <!-- Service accent point -->
  <circle cx="38" cy="26" r="1.8" fill="#fef08a" />
</svg>
