<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="full-boh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="full-foh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <radialGradient id="full-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#99f6e4"/>
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(6, 4)">
    <!-- Dark rounded badge -->
    <rect width="48" height="48" rx="14" fill="#0b171d" stroke="rgba(94, 234, 212, 0.3)" stroke-width="1.2"/>
    <circle cx="21" cy="29" r="12" fill="url(#full-spark)" opacity="0.35"/>

    <!-- Back-of-House (BOH) Vertical Pillar -->
    <path d="M14 9 C14 7.6 15.1 6.5 16.5 6.5 L21.5 6.5 C22.9 6.5 24 7.6 24 9 L24 28 C24 29.7 22.7 31 21 31 L16.5 31 C15.1 31 14 29.9 14 28.5 Z" fill="url(#full-boh)" />

    <!-- Front-of-House (FOH) Horizontal Cloche Arch -->
    <path d="M16 30 C16 26.5 19 23.5 22.5 23.5 L35.5 23.5 C38.5 23.5 41 26 41 29 C41 34.5 36.5 39 31 39 L19 39 C17.3 39 16 37.7 16 36 Z" fill="url(#full-foh)" />

    <!-- Bridge Nexus Connection -->
    <path d="M14 26 L24 26 L24 37 C24 38.1 23.1 39 22 39 L16.5 39 C15.1 39 14 37.9 14 36.5 Z" fill="#0f766e" opacity="0.95"/>

    <!-- Spark of Clarity -->
    <path d="M21 21 Q21 29 29 29 Q21 29 21 37 Q21 29 13 29 Q21 29 21 21 Z" fill="#ffffff" />
    <circle cx="21" cy="29" r="1.5" fill="#fef08a" />
    <circle cx="38" cy="26" r="1.8" fill="#fef08a" />
  </g>

  <!-- Typography: Wordmark "Luminex" -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#f2f5ef" letter-spacing="-0.03em">
    Lumin<tspan fill="#5eead4">e</tspan>x
  </text>

  <!-- Subtitle Tagline: "OPERATIONS OS" -->
  <text x="69" y="45" font-family="'DM Mono', monospace, Consolas" font-weight="500" font-size="9" fill="#6d8581" letter-spacing="0.14em">
    RESTAURANT OPERATIONS OS
  </text>
</svg>
